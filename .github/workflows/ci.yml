name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile source
        run: python -m compileall -q portfolio_optimizer start_live_trading.py
      - name: Run tests
        env:
          PORTFOLIO_OPTIMIZER_API_KEYS: ci-test-key
        run: pytest -q
      - name: Dependency audit
        run: python -m pip_audit -r requirements.txt

  docker-smoke:
    name: Docker smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t portfolio-optimizer:ci .
      - name: Start container
        run: |
          docker run -d --name portfolio-optimizer-ci \
            -e ENVIRONMENT=development \
            -e PORTFOLIO_OPTIMIZER_API_KEYS=ci-test-key \
            -p 8000:8000 portfolio-optimizer:ci
          for i in $(seq 1 30); do
            curl --fail http://127.0.0.1:8000/health && exit 0
            sleep 2
          done
          docker logs portfolio-optimizer-ci
          exit 1
      - name: Stop container
        if: always()
        run: docker rm -f portfolio-optimizer-ci || true

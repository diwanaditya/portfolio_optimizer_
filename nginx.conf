# Production nginx reverse proxy: TLS termination, security headers,
# rate limiting at the edge (a second layer in front of slowapi's
# application-level limiting), and static hosting for pricing.html.
#
# BEFORE USING THIS FILE: replace the placeholder cert paths with your
# real certificate (Let's Encrypt via certbot is the standard free
# option: https://certbot.eff.org), and replace `your-domain.com` with
# your actual domain in both server blocks.

worker_processes auto;
events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # Edge-level rate limiting -- a coarse first line of defense before a
    # request even reaches the application (which does its own, more
    # granular, per-API-key limiting via slowapi). 10 req/s per client IP
    # with a small burst allowance is a reasonable default; tune to your
    # actual traffic pattern.
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    # Redirect all plain HTTP to HTTPS.
    server {
        listen 80;
        server_name your-domain.com;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name your-domain.com;

        ssl_certificate     /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Static pricing page -- served directly by nginx, never touches
        # the Python process for a plain page load.
        location = /pricing.html {
            root /usr/share/nginx/html;
        }
        location = / {
            root /usr/share/nginx/html;
            try_files /pricing.html =404;
        }

        # Everything else proxies to the API. Stripe webhooks specifically
        # need the raw request body untouched (signature verification in
        # billing.py depends on the exact bytes Stripe sent) -- nginx's
        # default proxying already preserves the body correctly here, but
        # note this if you ever add request-body-rewriting middleware.
        location / {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://api:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }
    }
}
